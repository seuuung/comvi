        <a href="./5주차/session1.html" class="nav-card" id="week-5-card">
            <div class="card-content">
                <span class="week-num">Week 05</span>
                <h2>5주차</h2>
                <p>선분 근사(RDP), 허프 변환, RANSAC 및 다양한 코너 검출(Moravec, Harris, SUSAN) 알고리즘 시뮬레이션 실습입니다.</p>
            </div>
            <div class="go-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </a>

        <!-- 10주차 카드 -->
        <a href="./10주차/session1.html" class="nav-card" id="week-10-card">
            <div class="card-content">
                <span class="week-num">Week 10</span>
                <h2>10주차</h2>
                <p>KD 트리 구축, 최적 이웃 탐색(Nearest Neighbor), 그리고 BBF(Best Bin First)를 활용한 근사 탐색 시뮬레이션입니다.</p>
            </div>
            <div class="go-button">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
